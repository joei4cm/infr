[package]
name = "infr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "infr"
path = "src/main.rs"

[features]
# Off by default — see `crates/infr-sycl`'s doc. `--dev sycl` / `INFR_DEV=sycl` parses either
# way (see `parse_dev_spec`); without this feature it fails clearly at RUNTIME asking for a
# rebuild with `--features sycl`, rather than silently falling back to another device.
sycl = ["infr-llama/sycl"]

[dependencies]
infr-core.workspace = true
infr-prof-rt.workspace = true
infr-vulkan.workspace = true
infr-hub.workspace = true
infr-engine.workspace = true
infr-server.workspace = true
infr-llama = { path = "../infr-llama" }
clap.workspace = true
clap_complete.workspace = true
clap_complete_nushell.workspace = true
clap_mangen.workspace = true
anyhow.workspace = true
serde_json.workspace = true
libc.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
